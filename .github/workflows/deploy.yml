name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mmr-groups.whiterbread.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # Before any build: a build redirects wrangler to the generated config.
      - run: pnpm db:migrate:remote
      - run: pnpm build
        env:
          CLOUDFLARE_ENV: preview
      - run: pnpm --filter @mmr/web exec wrangler deploy
      - run: pnpm build
      - run: pnpm --filter @mmr/web exec wrangler deploy
      - run: pnpm --filter @mmr/e2e smoke
        env:
          SMOKE_URL: https://mmr-groups.whiterbread.workers.dev
