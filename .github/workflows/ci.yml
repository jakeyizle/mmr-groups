name: CI

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm scenarios:check --strict

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Browsers and their system deps are baked in; apt mirrors are too slow at times.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Image matches @playwright/test
        run: test "$(pnpm --filter @mmr/e2e exec playwright --version)" = "Version 1.64.1"
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2e/test-results
          retention-days: 7

  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [checks, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
      url: https://pr-${{ github.event.number }}-mmr-groups-preview.whiterbread.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm build
        env:
          CLOUDFLARE_ENV: preview
      - run: pnpm --filter @mmr/web exec wrangler versions upload --preview-alias pr-${{ github.event.number }}
